[project]
name = "amutah-api"
version = "0.1.0"
description = "Aid amuta case management API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13",
    "cryptography>=43",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
    "psycopg[binary]>=3.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"alembic/*" = ["S608"]
"alembic/versions/*" = ["E501"]
"app/scripts/demo_config.py" = ["E501"]
